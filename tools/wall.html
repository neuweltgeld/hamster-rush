<!doctype html><meta charset="utf-8"><title>HAMSTER RUSH wallpapers</title>
<body style="margin:0;background:#111">
<script type="module">
// Promo wallpaper renderer. Everything is drawn from the game's own generated sprite art and world

import { buildSprites } from '/src/sprites.js';

function bg(W, H, cx, cy, k = 3) {

  const ox = Math.round(cx * 2 - lw / 2), oy = Math.round(cy * 2 - lh / 2);
  for (let j = Math.floor(oy / 256); j <= Math.floor((oy + lh) / 256); j++) for (let i = Math.floor(ox / 256); i <= Math.floor((ox + lw) / 256); i++) {
    if (i < 0 || j < 0 || i > 15 || j > 11) continue; x.drawImage(world.chunkCanvas(i, j), i * 256 - ox, j * 256 - oy);

function sparkles(x, W, H, n, seed, cols = ['#ffffff', '#ffe9a0', '#bfe8ff'], sz = [3, 9]) {

// ---------------------------------------------------------------- original 5x7 bitmap logo
const G = { H: ['10001', '10001', '10001', '11111', '10001', '10001', '10001'], A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'], M: ['1000001', '1100011', '1010101', '1001001', '1000001', '1000001', '1000001'], S: ['01111', '10000', '10000', '01110', '00001', '00001', '11110'], T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'], E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111'], R: ['11110', '10001', '10001', '11110', '10100', '10010', '10001'], U: ['10001', '10001', '10001', '10001', '10001', '10001', '01110'] };
function logoLine(text, pal) {

  for (let y = 0; y < TH; y++) for (let xx = 0; xx < TW; xx++) if (!solid(xx, y)) { for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) if (solid(xx + a, y + b)) o[y * TW + xx] = 1; }
  for (let y = 0; y < TH; y++) for (let xx = 0; xx < TW; xx++) if (o[y * TW + xx]) put(xx, y, [22, 12, 36]);

}
const GOLD = ['#fff7b0', '#ffc233', '#f08a1c', '#fffbe0', '#b8480f', '#7a2a12'], HOT = ['#ffd2b0', '#ff7a4a', '#d9304a', '#ffe8d8', '#8a1430', '#5a1030'];
function logo(x, W, H, cx, top, k) {
  const a = logoLine('HAMSTER', GOLD), b = logoLine('RUSH', HOT);
  const wa = a.width * k, wb = b.width * k;
  x.imageSmoothingEnabled = false; x.drawImage(a, Math.round(cx - wa / 2), top, wa, a.height * k);

function centerText(x, str, px, col, k, cx, y) { const t = pixText(str, px, col, k); x.drawImage(t, Math.round(cx - t.width / 2), y); return y + t.height; }
// ---------------------------------------------------------------- chain blocks (Squeekchain motif)

// ---------------------------------------------------------------- scenes

    centerText(x, 'A LOOTER SHOOTER ON SQUEEKCHAIN', 9, '#ffe9a8', T(L, [6, 4]), W / 2, Math.round(yb + H * 0.012)); return c; },
  boss(W, H) { const L = W > H, [c, x] = bg(W, H, 410, 1240); const k = L ? 7 : 8;
    x.save(); x.globalCompositeOperation = 'multiply'; x.fillStyle = 'rgb(86,70,150)'; x.fillRect(0, 0, W, H); x.restore(); stars(x, W, H * 0.3, 40, 5);

    spr(x, 'bat_w2', W * T(L, [0.14, 0.12]), H * 0.5, 4, { cy: H * T(L, [0.35, 0.3]) }); spr(x, 'bat_w5', W * T(L, [0.86, 0.88]), H * 0.5, 4, { cy: H * T(L, [0.4, 0.34]), flip: true });

  chain(W, H) { const L = W > H, [c, x] = bg(W, H, 410, 440); const k = L ? 7 : 8;

    for (let i = 0; i < n; i++) { const t = i / (n - 1); const px = L ? W * (0.06 + t * 0.78) : W * (0.12 + (i % 2) * 0.46), py = L ? H * (0.6 + Math.sin(t * 3.1) * 0.05 - (i % 2) * 0.05) : H * (0.34 + t * 0.4);
